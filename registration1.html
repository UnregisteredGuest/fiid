<!DOCTYPE html>
<!--AUTHOR: Annie Snyder-->
<html>
	<head>
		<title>FIID Registration</title>
        <link rel="stylesheet" href="style.css">
	</head>
	<body>

		<h1>FIID Registration</h1>
		<form action="registration1.html" method="post">
			<label for="First Name">First Name:</label>
            <input type="text" id="First Name" name="First Name"><br><br>

            <label for="Last Name">Last Name:</label>  
            <input type="text" id="Last Name" name="Last Name"><br><br>

            <label for="Date of Birth">Date of Birth:</label>
            <input type="date" id="Date of Birth" name="Date of Birth"><br><br>

            <label for="Phone Number">Phone Number:</label>
            <input type="tel" id="Phone Number" name="Phone Number"><br><br>

            <label for="Email">Email:</label>
            <input type="email" id="Email" name="Email"><br><br>
		</form>

        <p>I am using this account as a(n):</p>
        <form action="registration1.html" method="post">
            <input type="radio" id="Personal" name="accountType" value="Personal Account">
            <label for="Personal">Personal Account</label><br>

            <input type="radio" id="Activist" name="accountType" value="Activist Account">
            <label for="Activist">Activist Account</label><br>

            <input type="radio" id="Donator" name="accountType" value="Donator Account">
            <label for="Donator">Donator Account</label><br>
        </form>

        <br>

        <a href="registration2.html" class="button">Next Page</a>
	</body>
</html>
