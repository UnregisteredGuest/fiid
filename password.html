<html>
	<head>
		<title>Edit Password</title>
        <script src="jquery-4.1.0.min.js"></script>
        <script src="jquery_scripts.js"></script>
        <link rel="stylesheet" href="style.css">
	</head>

	<body>
        <div id="nav"></div>
        <!--
            wireframe for layout - change?

		<h1>Password</h1><br>
        <p>Password</p>
        <a href="user_settings.html" class="button">Return to Settings</a><br><br>

        <p>Enter a new password:</p>
        <form action="password.html" method="post">
            <input type="password" id="password" name="password"><br><br>
            <input type="submit" value="Submit">
        </form>

        <p>Confirm new password:</p>
        <form action="password.html" method="post">
            <input type="password" id="confirmPassword" name="confirmPassword"><br><br>
            <input type="submit" value="Submit">
        </form>
	</body>
</html>
